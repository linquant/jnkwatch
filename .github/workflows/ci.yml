name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Unit tests (CMake + CTest)
        run: cd firmware-esp32 && ./test.sh
      - name: AMOLED lit-pixel budget
        run: cd firmware-esp32 && ./pixels.sh --check

  faces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build headless renderers
        run: |
          cd firmware-esp32
          cmake -S . -B build
          cmake --build build -j"$(nproc)" --target watch_shot watch_pixels
      - name: Render every face to PNG
        run: |
          cd firmware-esp32
          mkdir -p ../faces
          for f in 0 1 2 3 4 5 6 7 8; do
            ./build/watch_shot "../faces/face-$f.png" "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: faces
          path: faces/

  # The host tests never touch firmware/main/*.c or platform/ (ESP-IDF HAL),
  # so a hardware-only break would only show up on the watch. Build the real
  # image with the same ESP-IDF release as the maintainer's toolchain.
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build the ESP32-S3 image
        run: idf.py -C firmware-esp32/firmware -DIDF_TARGET=esp32s3 build
